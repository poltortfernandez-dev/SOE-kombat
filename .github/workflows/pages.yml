name: Comprobar archivos de Moro Kombat

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Pages publica automáticamente main desde la raíz (Settings > Pages).
# Este flujo comprueba los archivos sin iniciar una segunda publicación.
jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar exportación web
        run: |
          test -s index.html
          test -s index.js
          test -s index.wasm
          test -s index.pck
          test -f .nojekyll
